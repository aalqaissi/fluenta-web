server:
  port: 8080

spring:
  application:
    name: fluenta-api
  datasource:
    # SQLite — a single embedded file (./data/fluenta.db), no separate DB engine/server.
    url: jdbc:sqlite:./data/fluenta.db
    driver-class-name: org.sqlite.JDBC
    # SQLite allows a single writer; keep one connection to avoid "database is locked".
    hikari:
      maximum-pool-size: 1
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

# CORS origin for the Vite dev server (overridable via FLUENTA_CORS_ORIGINS).
fluenta:
  cors:
    origins: ${FLUENTA_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  media:
    dir: ${FLUENTA_MEDIA_DIR:./data/media}
  demo:
    password: ${FLUENTA_DEMO_PASSWORD:yalla-demo}
  ai:
    enabled: ${FLUENTA_AI_ENABLED:true}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${FLUENTA_AI_MODEL:claude-sonnet-5}
    effort: ${FLUENTA_AI_EFFORT:medium}
    timeout-seconds: ${FLUENTA_AI_TIMEOUT:60}
    max-essay-chars: ${FLUENTA_AI_MAX_ESSAY_CHARS:12000}
    max-image-bytes: ${FLUENTA_AI_MAX_IMAGE_BYTES:5000000}
    persist: ${FLUENTA_AI_PERSIST:true}

logging:
  level:
    org.hibernate.SQL: warn
